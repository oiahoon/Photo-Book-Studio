name: Check and deploy browser app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The optional original workbench tests use macOS sips and system fonts.
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: npm run public:check
      - run: npm run typecheck
      - name: Prepare explicit CI-only Kai font
        shell: bash
        run: |
          TASK_FONT_DIR="${{ runner.temp }}/pbs-test-fonts"
          mkdir -p "$TASK_FONT_DIR"
          curl -fsSL --retry 3 https://github.com/lxgw/LxgwWenKai/releases/download/v1.530/LXGWWenKai-Regular.ttf -o "$TASK_FONT_DIR/kai.ttf"
          echo "2d73eea94ad808999d90c0000c239a84a33b09d4bc6ab6c5b8bbf1eda8a7fc8b  $TASK_FONT_DIR/kai.ttf" | shasum -a 256 -c -
          echo "PBS_PDF_KAI_FONT=$TASK_FONT_DIR/kai.ttf" >> "$GITHUB_ENV"
          echo "PBS_PDF_KAI_FONT_NAME=LXGWWenKai-Regular" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build
      - run: npm run browser:build
      - run: npm run public:check -- --artifact dist-browser
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload browser app only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-browser
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
